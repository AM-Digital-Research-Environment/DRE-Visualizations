# Weekly version updates, on DRE-theme's cadence. Every pin in this repository
# is exact (actions by commit SHA), so these PRs are the routine way pins move;
# review the upstream release notes before merging a major bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release age before it is proposed: a compromised or broken
    # publish is usually yanked within days.
    cooldown:
      default-days: 5
    groups:
      build-toolchain:
        patterns:
          - '*'

  - package-ecosystem: pip
    directories:
      - /tools/embeddings
      - /tools/wordclouds
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      python-tools:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
