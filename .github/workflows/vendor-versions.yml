name: Vendored libraries

# The upgrade signal Dependabot cannot give: ECharts, echarts-wordcloud,
# MapLibre GL and the d3 force stack are committed files under asset/vendor,
# not npm dependencies, so nothing in .github/dependabot.yml sees them, and
# they are the code that reaches visitors' browsers.
#
#   - "npm latest": strict on the monthly schedule and on a manual run, where a
#     red run is the notification (GitHub emails the owner). On pull requests
#     it only annotates: pinning behind `latest` is a legitimate choice.
#   - "tarball bytes": always fatal. A vendored file that differs from the
#     file in the published npm package is a mistake or a tampered copy,
#     never a choice.
#
# The offline half (manifest, hashes, THIRD_PARTY_NOTICES) runs in every CI
# build as part of `npm run check`.

on:
  schedule:
    - cron: '17 5 1 * *'   # 05:17 UTC on the 1st
  workflow_dispatch:
  pull_request:
    paths:
      - 'asset/vendor/**'
      - 'THIRD_PARTY_NOTICES'
      - 'scripts/check-vendor.mjs'
      - 'scripts/vendor-maplibre.mjs'
      - 'scripts/lib/npm-tarball.mjs'
      - '.github/workflows/vendor-versions.yml'

permissions:
  contents: read

concurrency:
  group: vendor-versions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1, verified upstream 2026-10-28.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0, verified upstream 2026-10-28.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      # No `npm ci`: the checker uses Node built-ins only (fetch, zlib, crypto).
      - name: Compare the pins with the npm registry
        run: >-
          node scripts/check-vendor.mjs --latest
          ${{ github.event_name == 'pull_request' && '--warn-only' || '' }}
      - name: Compare every vendored file with its npm tarball
        if: always()
        run: node scripts/check-vendor.mjs --verify
