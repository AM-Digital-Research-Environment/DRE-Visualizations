name: Build semantic embeddings

# The open-weights EmbeddingGemma 2 model runs on the runner itself: no API
# key, no secret, and nothing heavy on the Omeka server. This workflow fetches
# only the unauthenticated public Omeka API, refreshes vectors incrementally,
# and publishes two kinds of GitHub Release:
#
# - `semantic-inputs-<n>`: the compact map/similar/report inputs. The module
#   downloads the newest one built for the site's current revision before it
#   regenerates (src/Precompute/EmbeddingInputs.php), so a new build reaches the
#   site without a module release. The site is pinged once the release exists.
# - `semantic-embeddings-v1-<n>`: the full vectors, for downstream indexes.
#
# Every night it builds only when the site changed since the last
# semantic-inputs release (tools/embeddings/source_state.py). Ordinary
# pull-request CI tests every pure contract without the model.
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Embedding scope
        required: true
        type: choice
        default: missing
        options:
          - missing
          - all
      publish_vectors:
        description: Publish the full-vector GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: semantic-embeddings
  cancel-in-progress: false

env:
  DRE_EMBEDDING_WORK_DIR: ${{ github.workspace }}/.cache/embeddings
  OMEKA_SITE_URL: ${{ vars.OMEKA_SITE_URL }}
  # Keep in step with MODEL_REVISION in build_embeddings.py (checked below).
  EMBEDDING_MODEL_REVISION: 914f7f89142e33e77833254d9c9b90c3cef7303b
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      # actions/checkout v7.0.1, verified upstream 2026-07-31.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # A manual run always builds; a scheduled one only when the site changed
      # since the newest semantic-inputs release. An unreachable site skips the
      # night with a warning; the next scheduled run checks again.
      - name: Compare the site with the last build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(gh release list --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("semantic-inputs-"))] | sort_by(.createdAt) | last | .tagName // ""')
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern source-state.json --dir "$RUNNER_TEMP/previous" || true
          fi
          python tools/embeddings/source_state.py "$RUNNER_TEMP/state.json" \
            --previous "$RUNNER_TEMP/previous/source-state.json" --skip-unreachable >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240  # a full CPU re-embed (scope: all) is the long case
    steps:
      # actions/checkout v7.0.1, verified upstream 2026-07-31.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.0.0, verified upstream 2026-10-07.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/embeddings/requirements-model.txt

      # actions/cache v6.1.0, verified upstream 2026-07-31. A unique write key
      # restores the newest prefix and persists the refreshed cache; the cache
      # file records model, revision, dimensions, prefix and dtype, and the
      # builder discards one that does not match.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/embeddings/cache.json
          key: embeddings-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            embeddings-v2-${{ runner.os }}-

      # The pinned model snapshot (~1.5 GB) is immutable per revision.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/huggingface/hub
          key: hf-embeddinggemma-2-${{ env.EMBEDDING_MODEL_REVISION }}

      - name: Install pinned dependencies
        run: |
          grep -q "$EMBEDDING_MODEL_REVISION" tools/embeddings/build_embeddings.py
          python -m pip install -r tools/embeddings/requirements-model.txt

      - name: Run embedding contract tests
        run: |
          python tools/embeddings/build_embeddings.py --validate-profile
          python -m unittest discover -s tools/embeddings/tests -v

      # Recorded before harvesting: an edit during the build is then seen as a
      # change by the next night's check, never lost.
      - name: Record the site's state
        run: python tools/embeddings/source_state.py "$RUNNER_TEMP/source-state.json"

      - name: Build public semantic artifacts
        run: python tools/embeddings/build_embeddings.py --scope "${{ inputs.scope || 'missing' }}"

      - name: Validate generated artifact set
        run: python tools/embeddings/build_embeddings.py --validate-artifacts

      # Save even when a later batch fails or the job times out: the builder
      # flushes finished batches, so the next run resumes instead of restarting.
      - name: Persist the incremental embedding cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/embeddings/cache.json
          key: embeddings-v2-${{ runner.os }}-${{ github.run_id }}

      - name: Publish versioned full-vector release
        if: ${{ github.event_name == 'schedule' || inputs.publish_vectors }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="semantic-embeddings-v1-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            .cache/embeddings/release/vectors.f32 \
            .cache/embeddings/release/ids.json \
            .cache/embeddings/release/manifest.json \
            --target "$GITHUB_SHA" \
            --title "AMIRA semantic embeddings v1 · EmbeddingGemma 2 · build ${GITHUB_RUN_NUMBER}" \
            --notes "Public AMIRA vectors. Read manifest.json before indexing; embedding spaces are model-specific." \
            --latest=false

      # Never the Latest release: the server's deploy pins that one as the module.
      - name: Publish the map inputs the module downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="semantic-inputs-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            data/embeddings/map.php \
            data/embeddings/similar.php \
            data/embeddings/report.php \
            "$RUNNER_TEMP/source-state.json" \
            --target "$GITHUB_SHA" \
            --title "AMIRA semantic map inputs · build ${GITHUB_RUN_NUMBER}" \
            --notes "Scoped semantic-map inputs for the DRE Visualizations module, which downloads the newest build made for its current publication revision." \
            --latest=false
          # Keep the ten newest; the module only ever reads the newest.
          gh release list --limit 200 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("semantic-inputs-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

      # The site installs the build and refreshes its snapshot in the background.
      # Not fatal: the next regeneration downloads it anyway.
      - name: Tell the site a new build is out
        run: |
          if ! answer=$(curl -fsS -X POST "${OMEKA_SITE_URL%/}/dre-data/embeddings-refresh"); then
            echo "::warning::The site did not take the ping; its next regeneration downloads the build."
          else
            echo "Site answered: $answer"
          fi
