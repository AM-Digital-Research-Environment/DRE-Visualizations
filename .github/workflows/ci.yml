name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contracts:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.0, verified upstream 2026-06-18.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - run: npm run check

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # shivammathur/setup-php 2.37.2, verified upstream 2026-06-08.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Pure PHP regression harnesses
        run: |
          php tests/PublicCorpusTest.php
          php tests/DataSelectionTest.php
          php tests/AmiraProfileTest.php
          php tests/CorpusSnapshotTest.php
          php tests/SnapshotPublisherTest.php
          php tests/AggregatorsTest.php
