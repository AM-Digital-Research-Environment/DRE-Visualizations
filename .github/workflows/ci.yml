name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contracts:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, verified upstream 2026-07-31.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: npm run check

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # shivammathur/setup-php 2.37.2, verified upstream 2026-06-08.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Pure PHP regression harnesses
        run: |
          php tests/PublicCorpusTest.php
          php tests/DataSelectionTest.php
          php tests/AmiraProfileTest.php
          php tests/CorpusSnapshotTest.php
          php tests/SnapshotPublisherTest.php
          php tests/AggregatorsTest.php
          php tests/KnowledgeGraphsTest.php

  # `php -l` parses; it does not check an override against its parent. Declaring
  # the module's classes against a real Omeka S core does, which is the only way
  # a bad hook signature fails here instead of blanking an admin page.
  module-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      # Omeka S 4.2.1, the current release of the supported ^4.0.0 line.
      - name: Fetch Omeka S core
        run: |
          curl -fsSL -o "$RUNNER_TEMP/omeka-s.zip" \
            https://github.com/omeka/omeka-s/releases/download/v4.2.1/omeka-s-4.2.1.zip
          unzip -q "$RUNNER_TEMP/omeka-s.zip" -d "$RUNNER_TEMP"
      - name: Module classes declare against Omeka S
        run: php scripts/check-module-contract.php "$RUNNER_TEMP/omeka-s"

  embeddings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v6.3.0, verified upstream 2026-07-31.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/embeddings/requirements.txt
      - name: Install pinned embedding dependencies
        run: python -m pip install -r tools/embeddings/requirements.txt
      - name: Validate profile and embedding contracts
        run: |
          python tools/embeddings/build_embeddings.py --validate-profile
          python -m unittest discover -s tools/embeddings/tests -v
