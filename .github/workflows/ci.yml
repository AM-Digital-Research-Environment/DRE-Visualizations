name: CI

# Also called by release.yml (workflow_call), so a release runs exactly these
# gates rather than a reduced copy of them.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A release calls this workflow; keep its run separate from branch runs.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  OMEKA_S_VERSION: 4.2.1
  # The same digest DRE-theme's CI pins for this release.
  OMEKA_S_SHA256: cc27d1c7aca0209523d19aa285f4a08e29e34950dcc446951a7c1311de348e82
  PHPSTAN_VERSION: 2.3.0
  # Also pinned in scripts/phpstan.mjs, the local runner.
  PHPSTAN_SHA256: 64a1e7737c6ac24b798a3331a769241308d40af6504630fd7c9dc9b7f1bec83f

jobs:
  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1, verified upstream 2026-10-07.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.0.0, verified upstream 2026-10-07.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # actions/cache v6.1.0, verified upstream 2026-10-07. The browser build is
      # keyed on the exact Playwright version in the lockfile.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Browser lifecycle tests
        env:
          PLAYWRIGHT_ARTIFACT_DIR: ${{ runner.temp }}/playwright
        run: npm run test:browser
      # actions/upload-artifact v7.0.2, verified upstream 2026-10-07.
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-failure
          path: ${{ runner.temp }}/playwright
          if-no-files-found: ignore
          retention-days: 7

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The supported range (module.ini php_version_constraint >=8.4);
        # production runs 8.5.
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # shivammathur/setup-php 2.37.2, verified upstream 2026-10-07.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: PHP syntax
        run: find . \( -name '*.php' -o -name '*.phtml' \) -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Pure PHP regression harnesses
        run: php scripts/test-php.php
      # Omeka S core: declaring the module's classes against it is the only way
      # a bad hook signature fails here instead of blanking an admin page, and
      # the integration suites run the generators against its Doctrine stack.
      - name: Fetch Omeka S core
        run: |
          curl -fsSL -o "$RUNNER_TEMP/omeka-s.zip" \
            "https://github.com/omeka/omeka-s/releases/download/v${OMEKA_S_VERSION}/omeka-s-${OMEKA_S_VERSION}.zip"
          echo "$OMEKA_S_SHA256  $RUNNER_TEMP/omeka-s.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/omeka-s.zip" -d "$RUNNER_TEMP"
      - name: Module contract and integration suites
        run: |
          php scripts/check-module-contract.php "$RUNNER_TEMP/omeka-s"
          php tests/integration/CoreContractsTest.php "$RUNNER_TEMP/omeka-s"
          php tests/integration/DatabaseTest.php "$RUNNER_TEMP/omeka-s"
          php tests/integration/LifecycleTest.php "$RUNNER_TEMP/omeka-s"
          php tests/integration/GoldenTest.php "$RUNNER_TEMP/omeka-s"
      - name: Static analysis (PHPStan)
        if: matrix.php == '8.5'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/phpstan.phar" \
            "https://github.com/phpstan/phpstan/releases/download/${PHPSTAN_VERSION}/phpstan.phar"
          echo "$PHPSTAN_SHA256  $RUNNER_TEMP/phpstan.phar" | sha256sum --check --strict
          php -d memory_limit=2G "$RUNNER_TEMP/phpstan.phar" analyse -c phpstan.neon.dist \
            --autoload-file "$RUNNER_TEMP/omeka-s/vendor/autoload.php" --no-progress

  # The module as Omeka meets it: the release archive unpacked into a real
  # Omeka S, the lifecycle run by Omeka's own ModuleManager, one regeneration
  # against a real database server, and every block rendered
  # (tests/integration/OmekaBootTest.php has the phases).
  omeka-boot:
    name: Omeka boot (PHP ${{ matrix.php }}, MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      # The image and digest production runs (omeka-s-docker docker-compose.yml);
      # its command-line flags there are buffer and cache tuning only.
      mysql:
        image: mysql:9.7.2@sha256:c7cb87a9822f499375287930cbff71d6d3b201e346b45108b1115b435ee2df13
        env:
          MYSQL_DATABASE: omeka
          MYSQL_USER: omeka
          MYSQL_PASSWORD: omeka
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # shivammathur/setup-php 2.37.2, verified upstream 2026-10-07.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_mysql, xml, zip
          coverage: none
          tools: none
      - name: Fetch Omeka S core
        run: |
          curl -fsSL -o "$RUNNER_TEMP/omeka-s.zip" \
            "https://github.com/omeka/omeka-s/releases/download/v${OMEKA_S_VERSION}/omeka-s-${OMEKA_S_VERSION}.zip"
          echo "$OMEKA_S_SHA256  $RUNNER_TEMP/omeka-s.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/omeka-s.zip" -d "$RUNNER_TEMP"
      # The archive a release ships, not the checkout: tests/, scripts/ and the
      # sources export-ignore strips stay out, as on a real installation.
      - name: Unpack the module's release archive into Omeka
        run: git archive --format=tar --prefix=DreVisualizations/ HEAD | tar -x -C "$RUNNER_TEMP/omeka-s/modules"
      # The database stays empty: the test's first phase installs Omeka with
      # its own Installer. One client login first prints the server version and
      # warms MySQL's caching_sha2 cache for the omeka user.
      - name: Point Omeka at the empty database
        env:
          MYSQL_PWD: omeka
        run: |
          printf 'user = "omeka"\npassword = "omeka"\ndbname = "omeka"\nhost = "127.0.0.1"\nport = 3306\n' \
            > "$RUNNER_TEMP/omeka-s/config/database.ini"
          mysql --host=127.0.0.1 --user=omeka omeka -e 'SELECT VERSION()'
      - name: Install, boot, regenerate, render, upgrade and uninstall
        env:
          DRE_VISUALIZATIONS_DATA_DIR: ${{ runner.temp }}/dre-visualizations-data
          EXPECTED_OMEKA_VERSION: ${{ env.OMEKA_S_VERSION }}
          EXPECTED_PHP_SERIES: ${{ matrix.php }}
        run: php tests/integration/OmekaBootTest.php "$RUNNER_TEMP/omeka-s"

  embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0, verified upstream 2026-10-07.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/embeddings/requirements.txt
      - name: Install pinned embedding dependencies
        run: python -m pip install -r tools/embeddings/requirements.txt
      - name: Validate profile and embedding contracts
        run: |
          python tools/embeddings/build_embeddings.py --validate-profile
          python -m unittest discover -s tools/embeddings/tests -v
