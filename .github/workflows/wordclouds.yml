name: Build word clouds

# Manual only — run after new transcripts / abstracts land (mirrors the in-Omeka
# "Regenerate now" rhythm). Regenerates the lemmatised word-frequency inputs in
# data/wordclouds/ and commits them; the in-Omeka precompute folds them in
# on the next regenerate, with an in-PHP tokeniser as the fallback.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # A PR opened with GITHUB_TOKEN triggers no pull_request workflows, so CI is
  # dispatched on the bot branch explicitly (gh workflow run, below).
  actions: write

concurrency:
  group: wordclouds
  cancel-in-progress: false

env:
  OMEKA_SITE_URL: ${{ vars.OMEKA_SITE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1, verified upstream 2026-10-07.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.0.0, verified upstream 2026-10-07.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/wordclouds/requirements.txt

      - name: Install spaCy + language models
        run: |
          pip install -r tools/wordclouds/requirements.txt
          pip install \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl \
            https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl \
            https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl \
            https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl

      - name: Build word-cloud inputs
        run: python tools/wordclouds/build_wordclouds.py

      - name: Open bot PR for regenerated inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wordclouds/
          if git diff --staged --quiet; then
            echo "No word-cloud changes."
          else
            branch="automation/wordclouds-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git commit -m "Word clouds: regenerate lemmatised frequencies"
            git push --set-upstream origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "Word clouds: regenerate lemmatised frequencies" \
              --body "Automated word-cloud refresh from workflow run ${GITHUB_RUN_ID}."
            gh workflow run ci.yml --ref "$branch"
          fi
