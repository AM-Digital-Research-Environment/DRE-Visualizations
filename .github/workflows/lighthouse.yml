name: Lighthouse budgets

# Page weight, request count and the Lighthouse accessibility, best-practices
# and performance scores of every block fixture that renders the precompute's
# golden output (scripts/check-lighthouse.mjs, ported from IWAC Visualizations).
# Bytes and requests are deterministic and hold within 10% of the committed
# baseline; scores are timed or measured on this runner, so their baseline must
# come from here: take tests/lighthouse/baseline.json from this job's
# `lighthouse` artifact to move one. The fixtures stub the theme and the data, so
# this answers for what the module ships, not for the live site.

on:
  push:
    branches: [main]
    paths:
      - 'asset/**'
      - 'config/asset-plans.json'
      - 'tests/browser/**'
      - 'tests/golden/**'
      - 'tests/lighthouse/**'
      - 'scripts/check-lighthouse.mjs'
      - 'package-lock.json'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    paths:
      - 'asset/**'
      - 'config/asset-plans.json'
      - 'tests/browser/**'
      - 'tests/golden/**'
      - 'tests/lighthouse/**'
      - 'scripts/check-lighthouse.mjs'
      - 'package-lock.json'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1, verified upstream 2026-10-07.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0, verified upstream 2026-10-07.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Chromium @playwright/test pins, not the runner's own Chrome, so a
      # runner image update cannot move the scores under an unchanged tree.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lighthouse budgets, median of three runs per block fixture
        run: npm run check:lighthouse
      # actions/upload-artifact v7.0.2, verified upstream 2026-10-07.
      - name: Keep the reports and the measured baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lighthouse
          path: test-results/lighthouse/
          retention-days: 14
          if-no-files-found: ignore
