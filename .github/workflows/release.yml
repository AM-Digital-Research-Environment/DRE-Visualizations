name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every CI gate — both PHP versions, the integration and golden suites,
  # PHPStan, the browser tests and the embedding contracts — not a subset.
  ci:
    # A job that calls a reusable workflow cannot take timeout-minutes; each
    # job inside ci.yml carries its own.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1, verified upstream 2026-10-07.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-node v7.0.0, verified upstream 2026-10-07.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Validate tag against release metadata
        run: node scripts/check-release-metadata.mjs --tag "${GITHUB_REF_NAME}"
      - name: Build Omeka-ready archive
        run: |
          git archive --format=zip --prefix=DreVisualizations/ "${GITHUB_SHA}" -o DreVisualizations.zip
          test "$(unzip -Z1 DreVisualizations.zip | cut -d/ -f1 | sort -u)" = "DreVisualizations"
          unzip -p DreVisualizations.zip DreVisualizations/config/module.ini | grep -F "version = \"${GITHUB_REF_NAME#v}\""
          node scripts/check-release-archive.mjs DreVisualizations.zip
      # The notes are written, not generated: the tag's own CHANGELOG.md
      # section (Keep a Changelog), as DRE-theme's release does. The metadata
      # check above has already failed the run if that section is missing.
      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" DreVisualizations.zip --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "${GITHUB_REF_NAME}"
