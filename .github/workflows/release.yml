name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Validate tag, metadata, and source
        run: |
          npm run check
          node scripts/check-release-metadata.mjs --tag "${GITHUB_REF_NAME}"
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/PublicCorpusTest.php
          php tests/DataSelectionTest.php
          php tests/AmiraProfileTest.php
          php tests/CorpusSnapshotTest.php
          php tests/SnapshotPublisherTest.php
          php tests/AggregatorsTest.php
      - name: Build Omeka-ready archive
        run: |
          git archive --format=zip --prefix=DreVisualizations/ "${GITHUB_SHA}" -o DreVisualizations.zip
          test "$(unzip -Z1 DreVisualizations.zip | cut -d/ -f1 | sort -u)" = "DreVisualizations"
          unzip -p DreVisualizations.zip DreVisualizations/config/module.ini | grep -F "version = \"${GITHUB_REF_NAME#v}\""
          unzip -Z1 DreVisualizations.zip | grep -Fx 'DreVisualizations/asset/js/dashboard-charts.bundle.js'
          if unzip -Z1 DreVisualizations.zip | grep -Eq '^DreVisualizations/asset/data/((item-dashboards|communities|knowledge-graphs|photo-galleries|featured-collections|item-set-dashboards)/|network-explorer\.json$)'; then
            echo 'Release archive contains installation-derived generated data.' >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" DreVisualizations.zip --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
